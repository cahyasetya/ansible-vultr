---
- name: Deploy CTools Application
  hosts: vultr-vm
  become: yes

  tasks:
    - name: Create log file
      file:
        path: /var/log/ctools.log
        state: touch
        mode: '0644'

    - name: Deploy systemd service file
      copy:
        dest: /etc/systemd/system/ctools.service
        mode: '0644'
        content: |
          [Unit]
          Description=CTools Flask Application
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/ctools
          Environment="PATH=/opt/ctools/venv/bin"
          ExecStart=/opt/ctools/venv/bin/python app.py
          Restart=always
          RestartSec=3
          StandardOutput=append:/var/log/ctools.log
          StandardError=append:/var/log/ctools.log

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart ctools

    - name: Enable ctools service
      systemd:
        name: ctools
        enabled: yes

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart ctools
      systemd:
        name: ctools
        state: restarted
