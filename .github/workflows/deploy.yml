---
name: Deploy with Ansible

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          pip install ansible

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VULTR_VM_IP }} >> ~/.ssh/known_hosts

      - name: Run Ansible playbooks
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          VULTR_VM_IP: ${{ secrets.VULTR_VM_IP }}
        run: |
          ansible-playbook -i inventory.yml provision.yml cloudflare-tunnel.yml
