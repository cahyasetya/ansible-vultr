---
- name: Install and Configure HAProxy
  hosts: vultr-vm
  become: yes

  vars:
    haproxy_frontend_port: 80
    haproxy_stats_port: 8404
    haproxy_stats_user: admin
    haproxy_stats_password: changeme
    # Add your backend servers here
    backend_servers:
      - name: web1
        address: 192.168.1.10
        port: 8080
      - name: web2
        address: 192.168.1.11
        port: 8080

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install HAProxy
      apt:
        name: haproxy
        state: present

    - name: Backup original HAProxy config
      copy:
        src: /etc/haproxy/haproxy.cfg
        dest: /etc/haproxy/haproxy.cfg.backup
        remote_src: yes
        force: no

    - name: Configure HAProxy
      template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: '0644'
        validate: haproxy -c -f %s
      notify: restart haproxy

    - name: Ensure HAProxy is enabled and started
      service:
        name: haproxy
        state: started
        enabled: yes

    - name: Configure UFW for HAProxy
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ haproxy_frontend_port }}"
        - "{{ haproxy_stats_port }}"

  handlers:
    - name: restart haproxy
      service:
        name: haproxy
        state: restarted
